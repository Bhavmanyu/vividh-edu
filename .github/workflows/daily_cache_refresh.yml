name: Daily Cache Refresh

on:
  schedule:
    - cron: '30 19 * * *'  # 01:00 IST daily
  workflow_dispatch:

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to warm cache
        run: |
          curl -s "$API_BASE/api/v1/colleges?limit=50" > /dev/null
          curl -s "$API_BASE/api/v1/stats" > /dev/null
          echo "Cache warmed successfully"
        env:
          API_BASE: ${{ secrets.API_BASE_URL }}
